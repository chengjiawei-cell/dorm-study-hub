# ============================================================
# Markdown 扩展
# ============================================================
markdown_extensions:
  # Python Markdown 内置扩展
  - admonition            # 提示框（!!! note/warning/danger 等）
  - attr_list             # 属性列表
  - md_in_html            # HTML 内嵌 Markdown
  - meta                  # 元数据
  - toc:                  # 目录
      permalink: true
      toc_depth: 3

  # PyMdown 扩展
  - pymdownx.highlight:   # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite  # 行内代码高亮
  - pymdownx.snippets      # 文件嵌入
  - pymdownx.superfences:  # 超级围栏（支持嵌套代码块、流程图等）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details       # 可折叠元素
  - pymdownx.caret         # 上标标记
  - pymdownx.mark          # 高亮标记
  - pymdownx.tilde         # 下标标记
  - pymdownx.critic        # 批注标记
  - pymdownx.keys          # 键盘按键
  - pymdownx.emoji:        # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:       # 标签页
      alternate_style: true
  - pymdownx.tasklist:     # 任务列表
      custom_checkbox: true

  # 数学公式（KaTeX）
  - pymdownx.arithmatex:
      generic: true

# ============================================================
# 插件
# ============================================================
plugins:
  - search:                # 搜索
      lang: zh
      separator: '[\s​\-、，。：；！？…]+'
  - git-revision-date-localized:  # 显示页面最后更新时间
      enabled: true
      type: date
      fallback_to_build_date: true
      enable_creation_date: true

# ============================================================
# 额外配置
# ============================================================
extra:
  # 社交媒体链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chengjiawei-cell/dorm-study-hub
  # 页脚自定义
  generator: false

# 数学公式支持
extra_javascript:
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css
  - stylesheets/extra.css
