# ============================================================
# 🏠 宿舍学习资源共享 - MkDocs 配置文件
# 技术栈: MkDocs + Material for MkDocs + GitHub Pages
# ============================================================

# --- 网站基本信息 ---
site_name: 🏠 宿舍学习资源共享
site_url: https://chengjiawei-cell.github.io/dorm-study-hub/
site_description: 人工智能专业宿舍学习资源共享平台 — 课程资料、竞赛指南、复习笔记一站式获取
site_author: 宿舍学习小组

# --- 仓库信息（部署后填入你的 GitHub 仓库地址）---
repo_url: https://github.com/chengjiawei-cell/dorm-study-hub
repo_name: dorm-study-hub
edit_uri: blob/main/docs/

# --- 版权 ---
copyright: Copyright &copy; 2026 宿舍学习小组 | 本站资源仅供内部学习使用

# ============================================================
# 主题配置 — Material for MkDocs
# ============================================================
theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  # --- 配色方案（日间 + 夜间）---
  palette:
    # 日间模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式
    # 夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换至夜间模式

  # --- 导航功能 ---
  features:
    # 侧边栏
    - navigation.sections        # 章节分组显示
    - navigation.expand          # 默认展开所有章节
    - navigation.indexes         # 章节可附带概述页（index.md）
    - navigation.top             # 返回顶部按钮
    - navigation.tracking        # URL 自动更新锚点
    - navigation.path            # 面包屑导航
    # 搜索
    - search.suggest             # 搜索建议
    - search.highlight           # 搜索结果高亮
    - search.share               # 分享搜索结果链接
    # 内容
    - content.code.copy          # 代码块复制按钮
    - content.code.annotate      # 代码注释
    - content.tabs.link          # 标签页链接
    # 页脚
    - navigation.footer          # 页脚导航

# ============================================================
# 导航结构（侧边栏）
# ============================================================
nav:
  - 🏠 首页: index.md

  - 📚 大一课程:
      - 大一课程/index.md
      - 高等数学: 大一课程/高等数学.md
      - 线性代数与解析几何: 大一课程/线性代数与解析几何.md
      - 计算机程序设计: 大一课程/计算机程序设计.md
      - 人工智能概论: 大一课程/人工智能概论.md
      - 大学物理: 大一课程/大学物理.md
      - 离散数学: 大一课程/离散数学.md

  - 📖 大二课程:
      - 大二课程/index.md
      - 概率统计与随机过程: 大二课程/概率统计与随机过程.md
      - 数据结构与算法: 大二课程/数据结构与算法.md
      - 机器学习: 大二课程/机器学习.md
      - 深度学习: 大二课程/深度学习.md
      - 计算机组成原理: 大二课程/计算机组成原理.md
      - 操作系统: 大二课程/操作系统.md

  - 🎓 通识课:
      - 通识课/index.md
      - 思政类: 通识课/思政类.md
      - 大学英语: 通识课/大学英语.md
      - 体育: 通识课/体育.md

  - 🏆 竞赛:
      - 竞赛/index.md
      - 数学建模: 竞赛/数学建模.md
      - 蓝桥杯: 竞赛/蓝桥杯.md
      - ICPC 程序设计竞赛: 竞赛/ICPC程序设计竞赛.md
      - Kaggle 数据科学竞赛: 竞赛/Kaggle数据科学竞赛.md

  - 📅 课表:
      - 课表/index.md

  - 📝 参与贡献: 参与贡献.md

# ============================================================
# Markdown 扩展
# ============================================================
markdown_extensions:
  # Python Markdown 内置扩展
  - admonition            # 提示框（!!! note/warning/danger 等）
  - attr_list             # 属性列表
  - md_in_html            # HTML 内嵌 Markdown
  - meta                  # 元数据
  - toc:                  # 目录
      permalink: true
      toc_depth: 3

  # PyMdown 扩展
  - pymdownx.highlight:   # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite  # 行内代码高亮
  - pymdownx.snippets      # 文件嵌入
  - pymdownx.superfences:  # 超级围栏（支持嵌套代码块、流程图等）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details       # 可折叠元素
  - pymdownx.caret         # 上标标记
  - pymdownx.mark          # 高亮标记
  - pymdownx.tilde         # 下标标记
  - pymdownx.critic        # 批注标记
  - pymdownx.keys          # 键盘按键
  - pymdownx.emoji:        # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:       # 标签页
      alternate_style: true
  - pymdownx.tasklist:     # 任务列表
      custom_checkbox: true

  # 数学公式（KaTeX）
  - pymdownx.arithmatex:
      generic: true

# ============================================================
# 插件
# ============================================================
plugins:
  - search:                # 搜索
      lang: zh
      separator: '[\s​\-、，。：；！？…]+'
  - git-revision-date-localized:  # 显示页面最后更新时间
      enabled: true
      type: date
      fallback_to_build_date: true
      enable_creation_date: true

# ============================================================
# 额外配置
# ============================================================
extra:
  # 社交媒体链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chengjiawei-cell/dorm-study-hub
  # 页脚自定义
  generator: false

# 数学公式支持
extra_javascript:
  - javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css
  - stylesheets/extra.css
