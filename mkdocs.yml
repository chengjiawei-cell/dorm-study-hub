          - 线性代数与解析几何: 学习/大一上/线性代数与解析几何.md
          - 思想道德与法治: 学习/大一上/思想道德与法治.md
          - 学术英语素养: 学习/大一上/学术英语素养.md
          - 计算机程序设计: 学习/大一上/计算机程序设计.md
          - 国防教育: 学习/大一上/国防教育.md
