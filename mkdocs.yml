# ============================================================
# 🏠 宿舍学习资源共享 - MkDocs 配置文件
# 技术栈: MkDocs + Material for MkDocs + GitHub Pages
# ============================================================

# --- 网站基本信息 ---
site_name: 🏠 107宿舍校园生活指北
site_url: https://chengjiawei-cell.github.io/dorm-study-hub/
site_description: 107宿舍校园生活指北 — 校外生活、校内生活、学习资源一站式攻略
site_author: 宿舍学习小组

# --- 仓库信息（部署后填入你的 GitHub 仓库地址）---
repo_url: https://github.com/chengjiawei-cell/dorm-study-hub
repo_name: dorm-study-hub
edit_uri: blob/main/docs/

# --- 版权 ---
copyright: Copyright &copy; 2026 107宿舍 | 本站资源仅供内部学习使用

# ============================================================
# 主题配置 — Material for MkDocs
# ============================================================
theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  # --- 配色方案（日间 + 夜间）---
  palette:
    # 日间模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式
    # 夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换至夜间模式

  # --- 导航功能 ---
  features:
    # 侧边栏
    - navigation.sections        # 章节分组显示
    - navigation.expand          # 默认展开所有章节
    - navigation.indexes         # 章节可附带概述页（index.md）
    - navigation.top             # 返回顶部按钮
    - navigation.tracking        # URL 自动更新锚点
    - navigation.path            # 面包屑导航
    # 搜索
    - search.suggest             # 搜索建议
    - search.highlight           # 搜索结果高亮
    - search.share               # 分享搜索结果链接
    # 内容
    - content.code.copy          # 代码块复制按钮
    - content.code.annotate      # 代码注释
    - content.tabs.link          # 标签页链接
    # 页脚
    - navigation.footer          # 页脚导航

# ============================================================
# 导航结构（侧边栏）
# ============================================================
